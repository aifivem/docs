name: Deploy site

# A merge into main rebuilds aifivem.com, which pulls these docs at build time.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the aifivem.com build
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK secret is not set, skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK"
